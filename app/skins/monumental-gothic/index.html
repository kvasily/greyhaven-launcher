<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Greyhaven</title>
  <link rel="stylesheet" href="launcher.css">
  <link rel="stylesheet" href="../../shared/chooser.css">
</head>
<body>
  <!-- The nave at night: ashlar wall, smoke, floor. Everything here is decoration. -->
  <div class="nave" aria-hidden="true">
    <div class="wall"></div>
    <div class="smoke s1"></div>
    <div class="smoke s2"></div>
    <div class="floor"></div>
  </div>

  <div class="stage">
    <!-- Ornamental frame: columns, gargoyles, praying priests, the tall window, candles. -->
    <div class="decor" aria-hidden="true">
      <div class="column col-l"><span class="cap"></span><span class="shaft"></span><span class="base"></span></div>
      <div class="column col-r"><span class="cap"></span><span class="shaft"></span><span class="base"></span></div>

      <!-- The gargoyles idle on their capitals (art/gargoyle-idle.webm, rendered from Gargoyle_Statue.blend).
           The right one is the same loop mirrored and started part-way through, so the two never move together. -->
      <div class="gargoyle garg-l">
        <span class="halo"></span>
        <video class="layer body" src="art/gargoyle-idle.webm" autoplay loop muted playsinline disablepictureinpicture></video>
        <span class="ember"></span>
      </div>
      <div class="gargoyle garg-r">
        <span class="halo"></span>
        <video class="layer body" src="art/gargoyle-idle.webm#t=2.3" autoplay loop muted playsinline disablepictureinpicture></video>
        <span class="ember"></span>
      </div>

      <!-- The tall window: the rose in its head, two lancets below (art/window-tall.png, from
           make_window_tall.py + make_rose_ornate.py). Lit from behind when the shard is up. -->
      <div class="crest">
        <span class="rose-bloom"></span>
        <div class="rose">
          <img class="layer img" src="art/window-tall.png" alt="">
          <img class="layer glow" src="art/window-tall-glow.png" alt="">
        </div>
        <!-- a little light from the lit window: soft god rays (art/window-rays.png: make_window_rays.py) -->
        <span class="rays"></span>
        <!-- dust flowing softly in the light, behind the tablet (dust.js) -->
        <span class="dust-front"><canvas></canvas></span>
      </div>

      <span class="spill spill-l"></span>
      <span class="spill spill-r"></span>

      <!-- Praying stone priests on their pedestals (art/priest-idle.webm, rendered from Stone_Hooded_Priest.blend).
           The votive candle at each one's feet is lit when Play is ready. -->
      <div class="bearer bearer-l">
        <div class="flick">
          <video class="layer rest" src="art/priest-idle.webm" autoplay loop muted playsinline disablepictureinpicture></video>
          <span class="light"></span>
          <span class="votive"><span class="halo"></span><span class="flame"><img class="flare" src="art/candle-flame-glow.png" alt=""><img class="tongue" src="art/candle-flame-core.png" alt=""></span></span>
        </div>
      </div>
      <div class="bearer bearer-r">
        <div class="flick">
          <video class="layer rest" src="art/priest-idle.webm#t=3.4" autoplay loop muted playsinline disablepictureinpicture></video>
          <span class="light"></span>
          <span class="votive"><span class="halo"></span><span class="flame"><img class="flare" src="art/candle-flame-glow.png" alt=""><img class="tongue" src="art/candle-flame-core.png" alt=""></span></span>
        </div>
      </div>

      <div class="candle c1"><img class="body" src="art/candle.png" alt=""><span class="halo"></span><span class="flame"><img class="flare" src="art/candle-flame-glow.png" alt=""><img class="tongue" src="art/candle-flame-core.png" alt=""></span></div>
      <div class="candle c2"><img class="body" src="art/candle.png" alt=""><span class="halo"></span><span class="flame"><img class="flare" src="art/candle-flame-glow.png" alt=""><img class="tongue" src="art/candle-flame-core.png" alt=""></span></div>
      <div class="candle c3"><img class="body" src="art/candle.png" alt=""><span class="halo"></span><span class="flame"><img class="flare" src="art/candle-flame-glow.png" alt=""><img class="tongue" src="art/candle-flame-core.png" alt=""></span></div>
      <div class="candle c4"><img class="body" src="art/candle.png" alt=""><span class="halo"></span><span class="flame"><img class="flare" src="art/candle-flame-glow.png" alt=""><img class="tongue" src="art/candle-flame-core.png" alt=""></span></div>
    </div>

    <main class="shrine">
      <header class="brand">
        <h1 class="wordmark"><img src="art/wordmark.png" alt="Greyhaven"></h1>
        <p class="tagline">One world. Every road leads somewhere worth going.</p>
      </header>

      <!-- Under the window: the shard's status on the sill, and any error or notice. (The news is
           no longer shown in this design; launcher.js still fills the hidden list.) -->
      <div class="reliquary">
        <ol id="news" class="news-list" hidden><li class="muted">Asking the shard…</li></ol>
        <div class="shard cartouche">
          <div id="status" class="status" data-state="checking"><span class="dot"></span><span id="status-text">Looking for the shard…</span></div>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </div>

      <footer class="altar">
        <section id="login" class="login" hidden></section>
        <button id="play" class="play" type="button" disabled>Play</button>
        <span id="version" class="version"></span>
      </footer>
    </main>

    <!-- the same beams again in front of the shrine, faint, so the light falls across the tablet too -->
  </div>

  <script src="mock.js"></script>
  <script src="launcher.js"></script>
  <script src="dust.js"></script>
  <script src="../../shared/chooser.js"></script>
</body>
</html>
